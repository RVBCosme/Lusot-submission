<svg xmlns="http://www.w3.org/2000/svg" width="560" height="500" viewBox="0 0 560 500" role="img" aria-labelledby="title desc">
<title id="title">Landmark alone: the alert's level against Lusot's</title>
<desc id="desc">Answered Set A photos counted by the alert's level, down the side with the deepest at the top, and Lusot's level, across with no flood seen first. The outlined cells are exact agreement.</desc>
<style>
svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.surface { fill: var(--surface); }
text { font-size: 12px; }
.tick { fill: var(--muted); }
.label { fill: var(--ink-2); }
.end { text-anchor: end; }
.mid { text-anchor: middle; }
.cell { fill: var(--surface); }
.s1 { fill: #86b6ef; }
.n1 { fill: #0b0b0b; }
.s2 { fill: #3987e5; }
.n2 { fill: #ffffff; }
.s3 { fill: #1c5cab; }
.n3 { fill: #ffffff; }
.s4 { fill: #0d366b; }
.n4 { fill: #ffffff; }
.diag { stroke: var(--axis); stroke-width: 1px; }
.count { font-size: 13px; font-weight: 600; text-anchor: middle; }
@media (prefers-color-scheme: dark) {
  svg { --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; }
  .s1 { fill: #184f95; }
  .n1 { fill: #ffffff; }
  .s2 { fill: #2a78d6; }
  .n2 { fill: #ffffff; }
  .s3 { fill: #6da7ec; }
  .n3 { fill: #0b0b0b; }
  .s4 { fill: #b7d3f6; }
  .n4 { fill: #0b0b0b; }
}
</style>
