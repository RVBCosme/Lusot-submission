AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lusot backend skeleton (MS1). One template, ap-southeast-1 only.

Parameters:
  AlarmEmail:
    Type: String
    NoEcho: true
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: an email address
    Description: Receives the dead-letter queue alarm (D17). Passed from the git-ignored samconfig.toml, never committed.
  BucketSuffix:
    Type: String
    AllowedPattern: "^[a-z0-9]{6,12}$"
    ConstraintDescription: 6 to 12 lowercase letters or digits
    Description: Makes the upload bucket's name globally unique.
  AppOrigins:
    Type: CommaDelimitedList
    Default: "https://localhost,http://localhost:5173,http://localhost:4173"
    Description: Origins allowed by CORS on the API and the bucket (the Capacitor app and the local dev and preview servers).

Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    # S3 checks that it may send to the queue when the notification is set.
    DependsOn: UploadQueuePolicy
    Properties:
      BucketName: !Sub "lusot-${BucketSuffix}-uploads"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          # GET lets the app fetch a report's layersUrl (MS5's N14).
          - AllowedMethods: [GET, POST]
            AllowedOrigins: !Ref AppOrigins
      LifecycleConfiguration:
        Rules:
          - Id: raw-1-day
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 1
          - Id: blurred-7-days
            Status: Enabled
            Prefix: blurred/
            ExpirationInDays: 7
          - Id: overlay-7-days
            Status: Enabled
            Prefix: overlay/
            ExpirationInDays: 7
          # A backstop for demo pins' photos: demo_pins.py refuses an --until more than 53
          # days ahead. No rule covers samples/, kept while the sample button exists (MS4-Q11).
          - Id: demo-60-days
            Status: Enabled
            Prefix: demo/
            ExpirationInDays: 60
      NotificationConfiguration:
        QueueConfigurations:
          - Event: "s3:ObjectCreated:*"
            Queue: !GetAtt UploadQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/

  UploadQueue:
    Type: AWS::SQS::Queue
    Properties:
      # At least 6x the analysis function's 180 s timeout.
      VisibilityTimeout: 1080
      # SQS's default 4 days, written down; shorter than the dead-letter queue's (C525).
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      # 6 days (C525): each message is an S3 event record with the uploader's IP. A message
      # expires by its first enqueue time, which the move here keeps, and a redrive sends a
      # new message, so a day before the move plus 6 days after it stays within 7.
      MessageRetentionPeriod: 518400
      SqsManagedSseEnabled: true

  UploadQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref UploadQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt UploadQueue.Arn
            Condition:
              # The ARN is built from the name: referencing the bucket would make a cycle.
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::lusot-${BucketSuffix}-uploads"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: reportId
          AttributeType: S
        - AttributeName: feedPart
          AttributeType: S
        - AttributeName: visibleUntil
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      # With the limits table, 19 read and 14 write units in all, inside the free 25 (plan Table 3).
      ProvisionedThroughput:
        ReadCapacityUnits: 10
        WriteCapacityUnits: 5
      GlobalSecondaryIndexes:
        - IndexName: reportId-index
          KeySchema:
            - AttributeName: reportId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
        # The map and the feed (C517, C519). Sparse: only items with a feedPart appear.
        # It projects the public pin fields alone, with the keys, so each write to it
        # stays one unit (MS4 spec §4.4).
        - IndexName: feed-index
          KeySchema:
            - AttributeName: feedPart
              KeyType: HASH
            - AttributeName: visibleUntil
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - reportId
              - lat
              - lng
              - gpsAccuracyM
              - capturedAt
              - mode
              - level
              - landmark
              - passability
              - levelIsFloor
              - basis
              - flags
              - credit
              - place
              - event
              - depthInMin
              - depthInMax
          ProvisionedThroughput:
            ReadCapacityUnits: 2
            WriteCapacityUnits: 2
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Device and global counters per UTC clock hour, and flag records (C508, C511). Keys
  # hold only SHA-256 hashes of device ids (C520), and every item has an expiresAt.
  LimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 2
        WriteCapacityUnits: 2
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # CORS goes in the OpenAPI body rather than CorsConfiguration. SAM resolves parameters in
      # CorsConfiguration itself and can turn AppOrigins' default into one comma-joined string;
      # here CloudFormation resolves the Ref, which gives a list. SAM adds the routes from Events.
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: !Ref AWS::StackName
          version: "1.0"
        paths: {}
        x-amazon-apigateway-cors:
          allowOrigins: !Ref AppOrigins
          allowMethods: [GET, POST]
          # The app's random device id (C508), and a 429's Retry-After (C522).
          allowHeaders: [content-type, x-lusot-device]
          exposeHeaders: [retry-after]
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      # The result poll's own limit (C508): in W16's rush, 50 phones polling every 2 s make 25 a second.
      RouteSettings:
        "GET /reports/{id}":
          ThrottlingRateLimit: 30
          ThrottlingBurstLimit: 60

  # The public feed's own read-only API, which any site may load (C521). Its origin is a
  # literal, so CorsConfiguration works here. GET only, no credentials, no access logs.
  FeedApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET]
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Bundled by `npm run build -w backend/api` from the root lockfile (R21); SAM only packages it.
      CodeUri: api/dist
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt ApiRole.Arn
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref ReportsTable
          INDEX_NAME: reportId-index
          BUCKET_NAME: !Ref UploadBucket
          STOP_PARAM_PREFIX: /lusot/stop/
          NODE_OPTIONS: --enable-source-maps
          LIMITS_TABLE_NAME: !Ref LimitsTable
          FEED_INDEX_NAME: feed-index
          # A literal, never a parameter (C515): MS6's post-gate commit sets it to "true".
          INCHES_SHOWN: "false"
      Events:
        CreateUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /uploads
        GetReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /reports/{id}
        ListNearby:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /reports
        MapPins:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /map/pins
        FlagReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /reports/{id}/flag
        ListSamples:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /samples
        RunSample:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /samples/{sampleId}
        Feed:
          Type: HttpApi
          Properties:
            ApiId: !Ref FeedApi
            Method: GET
            Path: /pins.geojson

  # Explicit roles (R19). SAM's generated roles would add AWSLambdaBasicExecutionRole (logs on *)
  # and, for an SQS event, AWSLambdaSQSQueueExecutionRole (SQS on *). With Role set, SAM adds nothing.
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Its own log group only. The template creates the group, so no logs:CreateLogGroup.
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ApiLogGroup.Arn
              # Reports and the limits table's counters. A flag's TransactWriteItems puts its
              # record in limits and updates the report, each part governed by these two.
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt ReportsTable.Arn
                  - !GetAtt LimitsTable.Arn
              # Nearby queries the table, the pin detail reportId-index, and the map and the feed feed-index.
              - Effect: Allow
                Action: dynamodb:Query
                Resource:
                  - !GetAtt ReportsTable.Arn
                  - !Sub "${ReportsTable.Arn}/index/reportId-index"
                  - !Sub "${ReportsTable.Arn}/index/feed-index"
              # The presigned POST is signed with this role, so the role must be able to write the key.
              # A sample run copies its stored photo to raw/ as well.
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${UploadBucket.Arn}/raw/*"
              # The pin detail's photo, overlay and layers links are signed with this role, and a
              # sample run reads the manifest and copies a stored sample.
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "${UploadBucket.Arn}/blurred/*"
                  - !Sub "${UploadBucket.Arn}/overlay/*"
                  - !Sub "${UploadBucket.Arn}/demo/*"
                  - !Sub "${UploadBucket.Arn}/samples/*"
              # So that a missing manifest or sample photo reads as 404 NoSuchKey, not 403
              # AccessDenied, as MS3a Task 16 recorded under the analysis role's raw/-limited
              # grant (R93). Only NoSuchKey reads as missing, and AccessDenied answers 500.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt UploadBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: "samples/*"
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lusot/stop/*"

  AnalysisFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./analysis
      DockerTag: ms1
    Properties:
      PackageType: Image
      ImageConfig:
        Command: [lusot_analysis.handler.handler]
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 180
      Role: !GetAtt AnalysisRole.Arn
      LoggingConfig:
        LogGroup: !Ref AnalysisLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref ReportsTable
          BUCKET_NAME: !Ref UploadBucket
          STOP_PARAM_PREFIX: /lusot/stop/
          MODEL_KEY_PARAM: /lusot/meta/model-api-key
          # The Meta spend counter's table (C527).
          LIMITS_TABLE_NAME: !Ref LimitsTable
      Events:
        Upload:
          Type: SQS
          Properties:
            Queue: !GetAtt UploadQueue.Arn
            BatchSize: 1
            # Caps analysis at 5 of the account's 10 concurrent executions; never reserved concurrency (C9).
            ScalingConfig:
              MaximumConcurrency: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  AnalysisRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: analysis
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Its own log group only. The template creates the group, so no logs:CreateLogGroup.
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AnalysisLogGroup.Arn
              # The SQS event source mapping and the handler use this queue, and only this queue.
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  # The handler's ReportNotFound retry makes a message visible again in 10 s (R92).
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt UploadQueue.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "${UploadBucket.Arn}/raw/*"
              # The stored photo and overlay: blurred/ and overlay/, or demo/ for a demo pin.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "${UploadBucket.Arn}/blurred/*"
                  - !Sub "${UploadBucket.Arn}/overlay/*"
                  - !Sub "${UploadBucket.Arn}/demo/*"
              # So that a missing raw photo reads as 404 NoSuchKey, not 403 AccessDenied. MS3a
              # Task 16 recorded NoSuchKey under this raw/-limited grant, so the handler's
              # missing-photo rule holds only NoSuchKey and AccessDenied retries (MS3a spec
              # §3.6, R93).
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt UploadBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: "raw/*"
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub "${ReportsTable.Arn}/index/reportId-index"
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt ReportsTable.Arn
              # The Meta spend counter (C527): read before each run, added to after it.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt LimitsTable.Arn
              # The key is a SecureString under the AWS managed aws/ssm key, which lets every
              # principal in the account decrypt through SSM, so no kms:Decrypt grant is needed.
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lusot/stop/*"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lusot/meta/model-api-key"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lusot/spend/stop-usd"
              # The spend stop sets the model-calls switch "on" (C527), and nothing else.
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lusot/stop/model-calls"

  # Created before their functions, so no invocation can make an unmanaged group first.
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  AnalysisLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  StopUploadsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /lusot/stop/uploads
      Type: String
      Value: "off"

  StopPublishParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /lusot/stop/publish
      Type: String
      Value: "off"

  StopModelCallsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /lusot/stop/model-calls
      Type: String
      Value: "off"

  # The Meta spend stop in USD (C527, C528): a literal, like INCHES_SHOWN, never a parameter.
  # $60 while building; set_spend_stop.py raises it to $140 at the submission deploy on Nov 4,
  # and again after any later deploy that puts it back to 60 (docs/operations.md).
  SpendStopParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /lusot/spend/stop-usd
      Type: String
      Value: "60"

  # The AWS credits (C528): one budget, which with the account-setup $5 budget (C25) stays
  # inside AWS's two free ones. A year from Oct 1, 2026 (epoch seconds, UTC), so it doesn't
  # reset on Nov 1. Credits and refunds are left out of the cost, so it measures the credits
  # being used up.
  MetaAndAwsBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        BudgetLimit:
          Amount: 150
          Unit: USD
        TimeUnit: ANNUALLY
        TimePeriod:
          Start: "1790812800"
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 140
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail

  # Unencrypted on purpose: CloudWatch can't publish to a topic under the AWS managed SNS key,
  # and a customer managed key isn't free.
  AlarmTopic:
    Type: AWS::SNS::Topic

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A message reached the analysis dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      # So Rene also hears when it clears.
      OKActions:
        - !Ref AlarmTopic

  # Spend alarms (MS4 spec §4.7): the Meta credits probably lapse during judging, and later
  # calls are billed to the card. Both stay inside the free plan's 10 alarms.
  AnalysisInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The analysis function ran more than 100 times in an hour.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalysisFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # 5,000 until Ask Lusot's spec sizes it. The feed's and the map's calls count too.
  ApiInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API function ran more than 5,000 times in an hour.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Every spend pause (C527): the handler logs spend_stop or spend_error on each flip of the
  # model-calls switch. Term patterns, since Lambda's text log format puts a prefix before
  # each JSON line. Ask Lusot adds a second filter on ApiLogGroup to the same metric.
  SpendPauseFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AnalysisLogGroup
      FilterPattern: '?"spend_error" ?"spend_stop"'
      MetricTransformations:
        - MetricNamespace: Lusot
          MetricName: SpendPauses
          MetricValue: "1"

  # No OKActions: the alarm clearing doesn't clear the switch.
  SpendPauseAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Meta model calls were paused at the spend stop or on a lost spend write. The model-calls switch stays on until cleared; see docs/operations.md.
      Namespace: Lusot
      MetricName: SpendPauses
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # A failed publish switch read (C516): the handler adds publish_switch to the report's line
  # only then, and writes the result unpublished. A lasting fault would empty the map and the
  # feed without a sound.
  PublishReadFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AnalysisLogGroup
      FilterPattern: '"publish_switch"'
      MetricTransformations:
        - MetricNamespace: Lusot
          MetricName: PublishReadErrors
          MetricValue: "1"

  PublishReadAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A publish switch read failed, so a live or demo result was written unpublished.
      Namespace: Lusot
      MetricName: PublishReadErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  # The public feed is at <FeedApiUrl>/pins.geojson.
  FeedApiUrl:
    Value: !GetAtt FeedApi.ApiEndpoint
  BucketName:
    Value: !Ref UploadBucket
  TableName:
    Value: !Ref ReportsTable
  # Names, not URLs: a queue URL contains the account ID (R20).
  QueueName:
    Value: !GetAtt UploadQueue.QueueName
  DeadLetterQueueName:
    Value: !GetAtt DeadLetterQueue.QueueName
