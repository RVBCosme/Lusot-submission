<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The page colour of each theme (styles/tokens.css), so the phone's bar matches the page. -->
    <meta name="theme-color" content="#FBFBF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lusot</title>
    <!-- The loading screen's styles (inside #root below), inline so the screen needs no file of its own: no font, no
         image, no request. A production build still waits for its render-blocking stylesheet in the head before the first
         paint; from then the screen covers the load of the script, until React's first render replaces it. The colours
         are the brand tokens in styles/tokens.css, repeated here because this runs before that file;
         loadingScreen.test.ts keeps them equal. It covers the screen on its own navy and leaves the page's background to
         the theme. Its top and bottom padding add the system bars' insets the way the app shell does (.safe-area in
         index.css): Capacitor's --safe-area-inset-* on Android, env() in a browser. It moves only when the person has not
         asked for less motion, and otherwise holds still as a dim, full bar, never a share that would read as stuck. -->
    <style>
      .boot{position:fixed;inset:0;display:flex;flex-direction:column;box-sizing:border-box;overflow:auto;background:#041A3A;color:#E1F4FE;text-align:center;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
      .boot-centre{position:relative;z-index:1;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;width:100%;max-width:26rem;margin:auto;padding:calc(2rem + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) 1.5rem 2rem}
      .boot-mark{display:block;width:auto;height:clamp(6rem,19vh,10rem)}
      .boot-name{margin:1.25rem 0 0;font-size:clamp(3rem,15vw,4.5rem);line-height:1;font-weight:800;letter-spacing:-.025em;color:#E1F4FE}
      .boot-tagline{margin:.75rem 0 0;font-size:1.125rem;line-height:1.35;font-weight:500;color:#AFCEF3}
      .boot-bar{width:min(62vw,16rem);height:.375rem;margin:2.5rem 0 0;border-radius:.1875rem;overflow:hidden;background:#183862}
      .boot-fill{display:block;width:100%;height:100%;border-radius:.1875rem;background:#0A8BFE;opacity:.6}
      .boot-status{margin:1rem 0 0;font-size:.9375rem;line-height:1.4;color:#AFCEF3}
      .boot-waves{position:absolute;left:0;right:0;bottom:4.5rem;height:8rem;overflow:hidden}
      .boot-waves svg{display:block;width:300%;height:100%;margin-left:-100%}
      .boot-waves path{fill:none;stroke:#0F3158;stroke-width:1.5}
      .boot-foot{position:relative;z-index:1;box-sizing:border-box;width:100%;max-width:34rem;margin:0 auto;padding:1rem 1.5rem calc(1.5rem + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)))}
      .boot-place{margin:0;font-size:.9375rem;line-height:1.4;color:#82A5D0}
      .boot-line{margin:.5rem 0 0;font-size:.8125rem;line-height:1.45;color:#82A5D0;text-wrap:balance}
      @media (max-height:32rem){.boot-mark{height:4.5rem}.boot-name{margin-top:.5rem;font-size:2.25rem}.boot-bar{margin-top:1.25rem}.boot-waves{display:none}}
      @keyframes boot-slide{from{transform:translateX(-100%)}to{transform:translateX(280%)}}
      @keyframes boot-drift{from{transform:translateX(0)}to{transform:translateX(33.3333%)}}
      @media (prefers-reduced-motion: no-preference){.boot-fill{width:36%;opacity:1;animation:boot-slide 1.6s ease-in-out infinite}.boot-waves svg{animation:boot-drift 24s linear infinite}}
    </style>
  </head>
  <body>
    <!-- React's render replaces everything inside #root, so this screen stays until the app's own code is running. -->
    <div id="root">
      <main class="boot" id="boot" aria-busy="true">
        <div class="boot-waves" aria-hidden="true">
          <svg viewBox="0 0 1800 120" preserveAspectRatio="none" focusable="false">
            <path transform="translate(0 0)" d="M-300 30Q-150 4 0 30T300 30 600 30 900 30 1200 30 1500 30 1800 30 2100 30"/>
            <path transform="translate(110 0)" d="M-300 54Q-150 32 0 54T300 54 600 54 900 54 1200 54 1500 54 1800 54 2100 54"/>
            <path transform="translate(220 0)" d="M-300 78Q-150 54 0 78T300 78 600 78 900 78 1200 78 1500 78 1800 78 2100 78"/>
            <path transform="translate(60 0)" d="M-300 100Q-150 82 0 100T300 100 600 100 900 100 1200 100 1500 100 1800 100 2100 100"/>
          </svg>
        </div>
        <div class="boot-centre">
          <!-- The mark: the master SVG in app/brand, word for word between its defs and its closing group. -->
          <svg class="boot-mark" viewBox="126 95 263 320" aria-hidden="true" focusable="false">
            <defs>
              <clipPath id="mark-clip">
                <path d="M130.7 120.4A21.2 21.2 0 0 1 151.9 99.2H197.6A32.7 32.7 0 0 1 230.3 131.9V324.6H356.8A27.8 27.8 0 0 1 384.6 352.4V383A27.8 27.8 0 0 1 356.8 410.7H204.1A73.5 73.5 0 0 1 130.7 337.3V216.6H164.3A7.3 7.3 0 0 0 164.3 201.9H130.7V158.6H164.3A7.3 7.3 0 0 0 164.3 143.9H130.7Z"/>
              </clipPath>
            </defs>
            <g clip-path="url(#mark-clip)">
              <rect x="120" y="95" width="270" height="320" fill="#E1F4FE"/>
              <path d="M122.5 260.8L130.7 261.1C138 262.2 142.9 262.9 147.4 262.9C173.5 262.9 173.9 252.2 200.1 252.2C212.3 252.2 222.5 255.6 230.3 258.9L236.8 259.2H390V416.5H122.5Z" fill="#0A8BFE"/>
            </g>
          </svg>
          <h1 class="boot-name">Lusot</h1>
          <p class="boot-tagline" data-fil="Lalim ng baha mula sa mga photo">Flood depth from photos</p>
          <div class="boot-bar" role="progressbar" aria-labelledby="boot-status"><span class="boot-fill"></span></div>
          <p class="boot-status" id="boot-status" data-fil="Nilo-load ang Lusot…">Loading Lusot…</p>
        </div>
        <div class="boot-foot">
          <p class="boot-place">Metro Manila</p>
          <p class="boot-line" lang="en">Lusot estimates depth at one spot. It is not advice to cross. Follow MMDA and local advisories.</p>
        </div>
      </main>
      <!-- A person who chose Taglish on About gets its lines at once. Storage can be missing or throw, so any failure leaves
           English. Nothing waits and nothing is requested. -->
      <script>
        (function () {
          try {
            if (localStorage.getItem('lusot.lang') === 'fil') {
              var lines = document.querySelectorAll('#boot [data-fil]');
              for (var i = 0; i < lines.length; i++) {
                lines[i].textContent = lines[i].getAttribute('data-fil');
                lines[i].setAttribute('lang', 'fil');
              }
            }
          } catch (e) {}
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
