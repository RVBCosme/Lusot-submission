<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Lusot</title>
  <!-- The master of Lusot's mark, redrawn from the owner's artwork (Lusot-Logo.png, in this folder) as simple shapes:
       an L-shaped flood gauge, its upper stem pale, its lower stem and foot water blue, a wavy waterline between, and
       two rounded tick notches cut into the stem's left edge. It sits where the artwork puts it on its square (so the
       icons keep the artwork's composition), on a transparent background: the Android foreground layers and the
       splash icon are cut from it. app/public/icons/icon.svg is this drawing on navy, and app/scripts/render-icons.mjs
       draws every PNG from the two. The colours are the brand tokens in app/src/styles/tokens.css. The outline is one
       path that carves the notches into the stem's edge; it clips the pale gauge and the water, so the two meet
       without a seam. A test keeps the drawing here and in icon.svg identical. -->
  <defs>
    <clipPath id="lusot-mark-clip">
      <path d="M130.7 120.4A21.2 21.2 0 0 1 151.9 99.2H197.6A32.7 32.7 0 0 1 230.3 131.9V324.6H356.8A27.8 27.8 0 0 1 384.6 352.4V383A27.8 27.8 0 0 1 356.8 410.7H204.1A73.5 73.5 0 0 1 130.7 337.3V216.6H164.3A7.3 7.3 0 0 0 164.3 201.9H130.7V158.6H164.3A7.3 7.3 0 0 0 164.3 143.9H130.7Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#lusot-mark-clip)">
    <rect x="120" y="95" width="270" height="320" fill="#E1F4FE"/>
    <path d="M122.5 260.8L130.7 261.1C138 262.2 142.9 262.9 147.4 262.9C173.5 262.9 173.9 252.2 200.1 252.2C212.3 252.2 222.5 255.6 230.3 258.9L236.8 259.2H390V416.5H122.5Z" fill="#0A8BFE"/>
  </g>
</svg>
