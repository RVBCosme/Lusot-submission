# The same three checks as `npm run check`, one job each, and the app's end-to-end suite, on every push and pull request.
# Actions are pinned to full commit SHAs (looked up Oct 28, 2026), with the release tag in a comment.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: check:node
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:node

  python:
    name: check:py
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: npm run check:py
      # MS6's harness also runs on Python 3.9 (its spec §3); uv downloads that CPython.
      - run: uv run --no-project --python 3.9 python eval/run_eval.py --from-saved --results eval/tests/fixtures/small_run

  secrets:
    name: check:secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: false # this job installs no packages, and the python job owns the cache key
      - name: Install gitleaks 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -fsSLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_8.30.1_checksums.txt"
          # The archive must match the release's checksums file, and the hash that file listed on Oct 28, 2026.
          sha256sum -c --ignore-missing gitleaks_8.30.1_checksums.txt
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          mkdir bin
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm run check:secrets

  # MS5 Task 18: the app's end-to-end suite. Chromium plays a synthetic street scene as the camera, and every network
  # answer is a route inside the tests (app/e2e/mocks.ts), so the job needs no secrets and reaches no real service.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w app
      # A failed run's traces, screenshots and HTML report, kept 7 days (CLAUDE.md's 7-day rule). They hold only the
      # suite's own synthetic pictures and answers. Pinned to the commit of v7.0.2, the release published Oct 7, 2026
      # (looked up Oct 30, 2026 on the action's releases page and its tag).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: |
            app/test-results/
            app/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
